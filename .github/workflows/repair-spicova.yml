name: repair-spicova-portrait
on:
  push:
    branches: [main]
    paths:
      - ".repair/spicova-*.b64"
      - ".github/workflows/repair-spicova.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild supplied portrait
        run: |
          cat .repair/spicova-0.b64 .repair/spicova-1.b64 .repair/spicova-2.b64 .repair/spicova-3.b64 .repair/spicova-4.b64 > /tmp/spicova.b64
          base64 -d /tmp/spicova.b64 > assets/dr-spicova.jpg
          file assets/dr-spicova.jpg
          test "$(xxd -p -l 2 assets/dr-spicova.jpg)" = "ffd8"
      - name: Commit portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dr-spicova.jpg
          git rm -r .repair
          git commit -m "Fix Dr Špicová portrait"
          git push
