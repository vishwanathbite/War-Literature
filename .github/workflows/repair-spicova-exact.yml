name: Install exact Dr Spicova photo

on:
  push:
    paths:
      - ".github/workflows/repair-spicova-exact.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact image blob
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/blobs/d473e065812919101f2107ca9050892a35c16317" \
            | jq -r '.content' | tr -d '\n' | base64 -d > assets/dr-spicova.jpg
          file assets/dr-spicova.jpg
          test "$(wc -c < assets/dr-spicova.jpg)" -gt 5000
          test "$(xxd -p -l 2 assets/dr-spicova.jpg)" = "ffd8"

      - name: Commit exact image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dr-spicova.jpg
          git commit -m "fix: install complete Dr Spicova photo" || exit 0
          git push
