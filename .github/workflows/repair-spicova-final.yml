name: repair-spicova-final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install exact portrait blob
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/vishwanathbite/War-Literature/git/blobs/4d229dc49ba6b05ad7734e283597f2009dec57c7" | jq -r .content | tr -d '\n' | base64 -d > assets/dr-spicova.jpg
          file assets/dr-spicova.jpg
          test "$(xxd -p -l 2 assets/dr-spicova.jpg)" = "ffd8"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dr-spicova.jpg
          git commit -m "Replace corrupted Dr Špicová portrait with valid image" || exit 0
          git push
